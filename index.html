<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Kernel FC - 4K PS5 Edition</title>
    <style>
        body { margin: 0; background: #05050a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container { text-align: center; }
        h1 { font-size: 2.5rem; background: linear-gradient(45deg, #00ff87, #60efff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        p { color: #888; font-size: 1.1rem; margin-bottom: 20px; }
        canvas { background: #0b1a12; border: 2px solid #00ff87; box-shadow: 0 0 30px rgba(0,255,135,0.4); border-radius: 8px; }
        .controls { margin-top: 15px; color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Cyber Kernel FC [PS5 4K Edition]</h1>
        <p>Next-Gen Arcade Match Simulation Engine</p>
        <canvas id="field" width="900" height="500"></canvas>
        <div class="controls">Use <b>Arrow Keys / W, A, S, D</b> to move | <b>SPACEBAR</b> to Shoot / Pass</div>
    </div>
    <script>
        const canvas = document.getElementById('field');
        const ctx = canvas.getContext('2d');
        
        let ball = { x: 450, y: 250, vx: 0, vy: 0, radius: 10 };
        let player = { x: 200, y: 250, radius: 15, speed: 4 };
        let keys = {};

        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function update() {
            if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
            if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

            // Boundaries
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Ball physics friction
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= 0.98;
            ball.vy *= 0.98;

            // Collision with player
            let dx = ball.x - player.x;
            let dy = ball.y - player.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < player.radius + ball.radius) {
                ball.vx = dx * 0.3;
                ball.vy = dy * 0.3;
            }

            // Ball field bounds
            if (ball.x < 0 || ball.x > canvas.width) ball.vx *= -1;
            if (ball.y < 0 || ball.y > canvas.height) ball.vy *= -1;
        }

        function draw() {
            // Pitch background
            ctx.fillStyle = '#0b1a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pitch markings
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 3;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 20);
            ctx.lineTo(canvas.width / 2, canvas.height - 20);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
            ctx.stroke();

            // Goals
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fillRect(0, 200, 15, 100);
            ctx.fillRect(canvas.width - 15, 200, 15, 100);

            // Player Avatar (PS5 Neon Blue)
            ctx.fillStyle = '#60efff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = '#60efff';
            ctx.shadowBlur = 15;

            // Ball (Neon Green)
            ctx.fillStyle = '#00ff87';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = '#00ff87';
            ctx.shadowBlur = 15;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
